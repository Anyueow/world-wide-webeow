# ===========================================================================
# Netlify serves ONE page: site/index.html.
#
# Ananya, 2026-09-18: "keep everything that you have on Netlify right now. I
# don't want you to show any of that website, and I just want a simple single
# screen with this text... I want this to be pushed to the Netlify side, and
# nothing else."
#
# So the Next.js app in src/ is untouched and still in the repo. It just does
# not build and does not deploy. There is no build step at all now: Netlify
# publishes the site/ folder as static files.
#
# TO PUT THE NEXT.JS SITE BACK: set command = "npm run build" and
# publish = "out". Nothing else was removed.
# ===========================================================================

[build]
  publish = "site"

# No [build.command]. Nothing to compile, so nothing can break the deploy.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
