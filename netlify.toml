[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Hashed build assets never change under a given name, so cache them hard.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# next/og metadata routes emit real PNGs at extensionless paths: out/icon,
# out/apple-icon, out/opengraph-image. Netlify infers Content-Type from the
# file extension, so with none it serves application/octet-stream. Browsers
# get an unreliable favicon and, worse, LinkedIn and Slack silently refuse to
# render the share card. These three headers are what make the OG image
# actually appear when the link is shared.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/icon"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/apple-icon"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
